# Publish the RedMed passerby shell from Roooted1776/frisky onto this repo's
# main branch. GitHub Pages is legacy / branch source (not Actions artifact),
# so the files must live in git. .nojekyll is required or Jekyll 404s /tapper/.
# Live write base: https://roooted1776.github.io/tapper/
# HTML / SW / assets only. No PHI. Source of truth is frisky.

name: Publish tapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout frisky (source of truth)
        uses: actions/checkout@v4
        with:
          repository: Roooted1776/RedMed-V1-Official
          path: frisky
          token: ${{ secrets.REDMED_READ_TOKEN }}

      - name: Copy passerby shell
        run: |
          set -euo pipefail
          bash frisky/scripts/publish-github-io.sh "$GITHUB_WORKSPACE/site"
          f="$GITHUB_WORKSPACE/site/tapper/index.html"
          test -f "$f"
          grep -q 'data-tab="medical"' "$f"
          grep -q 'data-tab="911"' "$f"
          grep -q 'data-tab="aid"' "$f"
          test -f "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Commit to main (Pages branch source)
        id: commit
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "shell already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync passerby shell from Roooted1776/frisky"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Smoke /tapper/
        run: |
          set -euo pipefail
          # GitHub Pages (Fastly) can keep serving a stale 404 for a short
          # while after a fresh deploy, and a brand-new deploy can also take
          # a few minutes to build. A cache-busting query string forces a
          # fresh fetch instead of a cached miss, and we give it more time
          # and more tries than before so a slow-but-real deploy still passes.
          ok=0
          for i in $(seq 1 40); do
            bust="$(date +%s%N)"
            code=$(curl -sS -L -o /tmp/tapper.out -w '%{http_code}' \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://roooted1776.github.io/tapper/?_cb=${bust}" || true)
            echo "try $i HTTP $code"
            if [ "$code" = "200" ] && grep -q 'data-tab="medical"' /tmp/tapper.out && grep -q 'data-tab="911"' /tmp/tapper.out && grep -q 'data-tab="aid"' /tmp/tapper.out; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::https://roooted1776.github.io/tapper/ did not serve RedMed · 911 · Aid after 40 tries (~6.5 min)"
            exit 1
          fi
